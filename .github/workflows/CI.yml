name: CI

on:
  push:
    branches: [master]
    tags: ["*"]
  pull_request:

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        version:
          - "1.11"
          - "1.12"
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
        arch:
          - x64

    steps:
      - uses: actions/checkout@v2

      - uses: julia-actions/setup-julia@v1
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gym pygame

      - uses: actions/cache@v3
        env:
          cache-name: cache-julia
        with:
          path: |
            ~/.julia/artifacts
            ~/.julia/compiled
            ~/.julia/packages
            ~/.julia/registries
          key: ${{ runner.os }}-${{ matrix.arch }}-${{ matrix.version }}-${{ env.cache-name }}-${{ hashFiles('**/Project.toml', '**/Manifest.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-${{ matrix.version }}-${{ env.cache-name }}-
            ${{ runner.os }}-${{ matrix.arch }}-${{ matrix.version }}-
            ${{ runner.os }}-

      - name: Instantiate and build PyCall
        run: |
          julia --project -e '
            using Pkg
            ENV["PYTHON"] = Sys.which("python")
            Pkg.instantiate()
            Pkg.build("PyCall")
          '

      - uses: julia-actions/julia-buildpkg@latest

      - run: |
          git config --global user.name Tester
          git config --global user.email te@st.er

      - name: Run Tests
        uses: julia-actions/julia-runtest@latest

      - uses: julia-actions/julia-processcoverage@v1

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Aero-Spec/Crux.jl
          files: ./lcov.info
          flags: unittests
          name: codecov-umbrella
