name: CI

on:
  push:
    branches: [master]
    tags: ["*"]
  pull_request:

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: true
      matrix:
        version: ["1.12"]
        os: [ubuntu-latest]
        arch: [x64]

    steps:
      - uses: actions/checkout@v2

      - uses: julia-actions/setup-julia@v1
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}

      - uses: actions/cache@v3
        env:
          cache-name: cache-julia
        with:
          path: |
            ~/.julia/artifacts
            ~/.julia/compiled
            ~/.julia/packages
            ~/.julia/registries
          key: ${{ runner.os }}-${{ matrix.arch }}-${{ matrix.version }}-${{ env.cache-name }}-${{ hashFiles('**/Project.toml', '**/Manifest.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-${{ matrix.version }}-${{ env.cache-name }}-
            ${{ runner.os }}-${{ matrix.arch }}-${{ matrix.version }}-
            ${{ runner.os }}-

      - uses: julia-actions/julia-buildpkg@latest

      - run: |
          git config --global user.name Tester
          git config --global user.email te@st.er

      - name: Run Tests
        uses: julia-actions/julia-runtest@latest

      - uses: julia-actions/julia-processcoverage@v1

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Aero-Spec/Crux.jl
          files: ./lcov.info
          flags: unittests
          name: codecov-umbrella
